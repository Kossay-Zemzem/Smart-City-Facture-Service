spring.application.name=facture
#Server port is different from the soap endpoint port to avoid conflicts
server.port=8182

# SOAP endpoint and Eureka registration
soap.port=${SOAP_PORT:8082}
soap.host=${SOAP_HOST:localhost}
soap.endpoint.address=http://${soap.host}:${soap.port}/services/API
#eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port-enabled=true
eureka.instance.non-secure-port=8082
eureka.instance.hostname=localhost

#automatically update the database schema
spring.jpa.hibernate.ddl-auto=create-drop
#show SQL queries in console
spring.jpa.show-sql=true
#-----------------------------------------------------------------

#-------------------------------------------------
#  Paramètres de la base de données
#-------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/factureDB;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
#dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
